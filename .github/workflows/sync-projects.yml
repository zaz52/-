name: Sync projects from GitHub

# 每天自动把 zaz52 的 GitHub 公开新仓库同步到网站作品区。
# 流程：拉取仓库列表 -> 更新 src/data/generated.json -> 有变化则提交到 main
#   -> Netlify 监听 main 自动重新部署 -> （可选）自动部署 Cloudflare Worker（主站）
on:
  push:
    branches: [main] # 每次推送代码都自动部署 Worker（主站）
  schedule:
    - cron: '0 20 * * *' # 每天北京时间 04:00
  workflow_dispatch: # 手动触发

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sync projects from GitHub
        run: node scripts/sync-projects.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit if changed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/generated.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "no changes"
          else
            git commit -m "chore: auto-sync projects from GitHub"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  # 主站（weiyiai.top）是 Cloudflare Worker，不会自动部署，有变化时在这里顺手部署。
  # 需要在仓库 Settings -> Secrets and variables -> Actions 里添加：
  #   CLOUDFLARE_API_TOKEN（Edit Cloudflare Workers 模板）
  #   CLOUDFLARE_ACCOUNT_ID
  # 没配 secret 时自动跳过，不影响同步本身。
 deploy-worker:
  needs: sync
  # push/手动触发：每次都部署；定时任务：有新项目才部署
  if: needs.sync.outputs.changed == 'true' || github.event_name != 'schedule'
  runs-on: ubuntu-latest
  steps:
    - uses: actions/checkout@v4
      with:
        ref: main

    - uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Build and deploy to Cloudflare Workers
      # 没配 CLOUDFLARE_API_TOKEN 时跳过，不影响同步本身
      if: secrets.CLOUDFLARE_API_TOKEN != ''
      run: |
        npm ci
        npm run build
        npx wrangler deploy
      env:
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
